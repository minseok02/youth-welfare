services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youth-welfare-app
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/youth_welfare?sslmode=disable
      APP_PII_DB_URL: jdbc:postgresql://db:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii
      NOTIFICATION_PII_DB_URL: jdbc:postgresql://db:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii
      DB_USERNAME: app_core_rw
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_PII_USERNAME: app_pii_rw
      DB_APP_PII_PASSWORD: ${DB_APP_PII_PASSWORD:-${DB_PASSWORD}}
      DB_NOTIFICATION_PII_RO_USERNAME: notification_pii_ro
      DB_NOTIFICATION_PII_RO_PASSWORD: ${DB_NOTIFICATION_PII_RO_PASSWORD:-${DB_PASSWORD}}
      DB_RECOMMENDATION_REVIEW_GATE_COMMAND_USERNAME: recommendation_review_gate_command_rw
      DB_RECOMMENDATION_REVIEW_GATE_COMMAND_PASSWORD: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_PASSWORD:-${DB_PASSWORD}}
      DB_RECOMMENDATION_PERSISTENCE_COMMAND_USERNAME: recommendation_persistence_command_rw
      DB_RECOMMENDATION_PERSISTENCE_COMMAND_PASSWORD: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_PASSWORD:-${DB_PASSWORD}}
      DB_CHAT_SESSION_CLEANUP_USERNAME: chat_session_cleanup_rw
      DB_CHAT_SESSION_CLEANUP_PASSWORD: ${DB_CHAT_SESSION_CLEANUP_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      PUBLIC_DATA_PORTAL_API_KEY: ${PUBLIC_DATA_PORTAL_API_KEY:-}
      YOUTH_API_KEY: ${YOUTH_API_KEY:-${PUBLIC_DATA_PORTAL_API_KEY:-}}
      COLLECT_DETAIL_REQUEST_INTERVAL_MS: 50
      OPENAI_EMBEDDING_FORCE_LOCAL_FALLBACK: "true"
      SECURITY_ADMIN_EMAILS: ${SECURITY_ADMIN_EMAILS:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-https://youthmoa.kr}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    container_name: youth-welfare-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16@sha256:6d5c7b5aa3eb2098a2365f6d8cff723fded9e0e680757908b0b144b47f9c069c
    container_name: youth-welfare-db
    labels:
      com.youth-welfare.local-db-guard: ${ALLOW_LOCAL_DOCKER_DB:?Refusing to start local PostgreSQL. Use docker-compose.prod.yml on EC2/RDS; set ALLOW_LOCAL_DOCKER_DB=true only for the local Docker stack.}
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: youth_welfare
      DB_USERNAME: app_core_rw
      DB_APP_PII_USERNAME: app_pii_rw
      DB_NOTIFICATION_PII_RO_USERNAME: notification_pii_ro
      DB_RECOMMENDATION_REVIEW_GATE_COMMAND_USERNAME: recommendation_review_gate_command_rw
      DB_RECOMMENDATION_PERSISTENCE_COMMAND_USERNAME: recommendation_persistence_command_rw
      DB_CHAT_SESSION_CLEANUP_USERNAME: chat_session_cleanup_rw
      DB_MIGRATION_USERNAME: migration_admin
      DB_APP_PII_PASSWORD: ${DB_APP_PII_PASSWORD:-${DB_PASSWORD}}
      DB_NOTIFICATION_PII_RO_PASSWORD: ${DB_NOTIFICATION_PII_RO_PASSWORD:-${DB_PASSWORD}}
      DB_RECOMMENDATION_REVIEW_GATE_COMMAND_PASSWORD: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_PASSWORD:-${DB_PASSWORD}}
      DB_RECOMMENDATION_PERSISTENCE_COMMAND_PASSWORD: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_PASSWORD:-${DB_PASSWORD}}
      DB_CHAT_SESSION_CLEANUP_PASSWORD: ${DB_CHAT_SESSION_CLEANUP_PASSWORD:-${DB_PASSWORD}}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-${DB_PASSWORD}}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/postgres/init/z90-create-runtime-db-users.sh:/docker-entrypoint-initdb.d/z90-create-runtime-db-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d youth_welfare"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
