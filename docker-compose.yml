services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youth-welfare-app
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/youth_welfare?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      APP_PII_DB_URL: ${APP_PII_DB_URL:-jdbc:mysql://db:3306/youth_welfare_pii?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
      NOTIFICATION_PII_DB_URL: ${NOTIFICATION_PII_DB_URL:-jdbc:mysql://db:3306/youth_welfare_pii?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
      DB_USERNAME: ${DB_USERNAME:-app_core_rw}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_PII_USERNAME: ${DB_APP_PII_USERNAME:-app_pii_rw}
      DB_APP_PII_PASSWORD: ${DB_APP_PII_PASSWORD:-${DB_PASSWORD}}
      DB_NOTIFICATION_PII_RO_USERNAME: ${DB_NOTIFICATION_PII_RO_USERNAME:-notification_pii_ro}
      DB_NOTIFICATION_PII_RO_PASSWORD: ${DB_NOTIFICATION_PII_RO_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      AES_SECRET_KEY: ${AES_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_PASSWORD: ${GMAIL_PASSWORD}
      YOUTH_API_KEY: ${YOUTH_API_KEY}
      BOKJIRO_API_KEY: ${BOKJIRO_API_KEY}
      SECURITY_ADMIN_EMAILS: ${SECURITY_ADMIN_EMAILS:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-https://youthmoa.kr}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: youth-welfare-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: youth-welfare-db
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: youth_welfare
      MYSQL_APP_USERNAME: ${MYSQL_APP_USERNAME:-app_core_rw}
      MYSQL_APP_PASSWORD: ${DB_PASSWORD}
      MYSQL_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:-migration_admin}
      MYSQL_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-${DB_PASSWORD}}
      MYSQL_APP_PII_USERNAME: ${DB_APP_PII_USERNAME:-app_pii_rw}
      MYSQL_APP_PII_PASSWORD: ${DB_APP_PII_PASSWORD:-${DB_PASSWORD}}
      MYSQL_NOTIFICATION_PII_RO_USERNAME: ${DB_NOTIFICATION_PII_RO_USERNAME:-notification_pii_ro}
      MYSQL_NOTIFICATION_PII_RO_PASSWORD: ${DB_NOTIFICATION_PII_RO_PASSWORD:-${DB_PASSWORD}}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./deploy/mysql/init/z90-create-runtime-db-users.sh:/docker-entrypoint-initdb.d/z90-create-runtime-db-users.sh:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --ngram-token-size=2
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
