name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            .

  codeql-analysis:
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin,javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_REFRESH_COOKIE_SECURE: "false"
      JWT_SECRET: "01234567890123456789012345678901"
      AES_SECRET_KEY: 0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: test-openai-key
      GMAIL_USERNAME: ci@example.com
      GMAIL_PASSWORD: ci-password

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run backend unit tests
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  frontend-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALLOW_LOCAL_DOCKER_DB: "true"
      APP_BASE_URL: http://127.0.0.1:5173
      AUTH_REFRESH_COOKIE_SECURE: "false"
      DB_PASSWORD: welfare1234!
      JWT_SECRET: "01234567890123456789012345678901"
      AES_SECRET_KEY: 0123456789abcdef0123456789abcdef
      OPENAI_API_KEY: test-openai-key
      GMAIL_USERNAME: ci@example.com
      GMAIL_PASSWORD: ci-password
      SECURITY_ADMIN_EMAILS: admin@example.com
      E2E_ADMIN_EMAIL: admin@example.com
      E2E_ADMIN_PASSWORD: password123!
      E2E_USER_EMAIL: playwright.user@example.com
      E2E_USER_PASSWORD: Password123!
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
      SERVER_PORT: "8082"
      VITE_API_BASE_URL: http://127.0.0.1:8082

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare CI compose env file
        run: touch .env

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Start PostgreSQL and Redis
        run: docker compose up -d db redis

      - name: Start backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew bootRun --no-daemon > ../backend-bootRun.log 2>&1 &
          echo $! > ../backend-bootRun.pid

      - name: Bootstrap frontend smoke data
        working-directory: frontend
        env:
          APP_BASE_URL: http://127.0.0.1:8082
          HEALTH_URL: http://127.0.0.1:8082/actuator/health
        run: bash ./scripts/bootstrap-playwright-smoke-data.sh

      - name: Run runtime logout smoke
        env:
          APP_BASE_URL: http://127.0.0.1:8082
          APP_HEALTH_URL: http://127.0.0.1:8082/actuator/health
          REQUIRE_RECOMMENDATIONS: "false"
        run: bash deploy/smoke/run-local-runtime-api-smoke.sh

      - name: Run admin forced logout smoke
        env:
          APP_BASE_URL: http://127.0.0.1:8082
          APP_HEALTH_URL: http://127.0.0.1:8082/actuator/health
          APP_LOG_FILE: ${{ github.workspace }}/backend-bootRun.log
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: password123!
        run: bash deploy/smoke/run-local-admin-forced-logout-smoke.sh

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Run frontend browser smoke
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload frontend/browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-smoke-artifacts
          path: |
            backend-bootRun.log
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

      - name: Stop backend and docker services
        if: always()
        run: |
          if [[ -f backend-bootRun.pid ]]; then
            kill "$(cat backend-bootRun.pid)" || true
          fi
          docker compose down -v
