tasks.named('test') {
    useJUnitPlatform()
    exclude '**/integration/**'
}

def integrationRuntimePreflightDisabled = {
    def envValue = System.getenv('SKIP_INTEGRATION_RUNTIME_PREFLIGHT')
    def propertyValue = findProperty('skipIntegrationRuntimePreflight')
    return 'true'.equalsIgnoreCase(String.valueOf(envValue)) ||
        'true'.equalsIgnoreCase(String.valueOf(propertyValue))
}

def canConnectToPort = { String host, int port, int timeoutMs ->
    Socket socket = new Socket()
    try {
        socket.connect(new InetSocketAddress(host, port), timeoutMs)
        return true
    } catch (Exception ignored) {
        return false
    } finally {
        try {
            socket.close()
        } catch (Exception ignored) {
        }
    }
}

