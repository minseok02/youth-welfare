plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

import java.net.InetSocketAddress
import java.net.Socket

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'  // WebClient

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // Redis (Refresh Token 저장)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // XML 파싱 (복지로 API) — XXE 비활성화 필수
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // HTML 정제 (XSS 방지)
    implementation 'org.jsoup:jsoup:1.17.2'

    // Web Push
    implementation 'nl.martijndwars:web-push:5.1.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootRun {
    def envFile = file("../.env")
    def envFileValues = [:]
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def key = trimmed.substring(0, idx).trim()
                    def value = trimmed.substring(idx + 1).trim()
                    envFileValues[key] = value
                    environment(key, value)
                }
            }
        }
    }
    def runtimeEnv = { String key ->
        System.getenv(key) ?: envFileValues[key]
    }
    def sanitizedJdbcUrl = { String value, String fallback ->
        if (!value || value.startsWith('jdbc:mysql://') || value.startsWith('jdbc:postgresql://db:')) {
            return fallback
        }
        value
    }
    def sanitizedUsername = { String value, String fallback ->
        if (!value || value == 'root') {
            return fallback
        }
        value
    }
    def sanitizedRedisHost = { String value ->
        if (!value || value == 'redis') {
            return 'localhost'
        }
        value
    }
    def sanitizedRedisPort = { String value ->
        value ?: '6379'
    }

    // Docker 컨테이너 포트 로컬 매핑 (db:5432 -> localhost:5433, redis -> localhost)
    environment 'DB_URL', sanitizedJdbcUrl(runtimeEnv('DB_URL'), 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable')
    environment 'DB_USERNAME', sanitizedUsername(runtimeEnv('DB_USERNAME'), 'app_core_rw')
    environment 'DB_PASSWORD', runtimeEnv('DB_PASSWORD') ?: ''
    environment 'APP_PII_DB_URL', sanitizedJdbcUrl(runtimeEnv('APP_PII_DB_URL'), 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii')
    environment 'DB_APP_PII_USERNAME', sanitizedUsername(runtimeEnv('DB_APP_PII_USERNAME'), 'app_pii_rw')
    environment 'DB_APP_PII_PASSWORD', runtimeEnv('DB_APP_PII_PASSWORD') ?: (runtimeEnv('DB_PASSWORD') ?: '')
    environment 'NOTIFICATION_PII_DB_URL', sanitizedJdbcUrl(runtimeEnv('NOTIFICATION_PII_DB_URL'), 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii')
    environment 'DB_NOTIFICATION_PII_RO_USERNAME', sanitizedUsername(runtimeEnv('DB_NOTIFICATION_PII_RO_USERNAME'), 'notification_pii_ro')
    environment 'DB_NOTIFICATION_PII_RO_PASSWORD', runtimeEnv('DB_NOTIFICATION_PII_RO_PASSWORD') ?: (runtimeEnv('DB_PASSWORD') ?: '')
    environment 'REDIS_HOST', sanitizedRedisHost(runtimeEnv('REDIS_HOST'))
    environment 'REDIS_PORT', sanitizedRedisPort(runtimeEnv('REDIS_PORT'))
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/integration/**'
}

def integrationRuntimePreflightDisabled = {
    def envValue = System.getenv('SKIP_INTEGRATION_RUNTIME_PREFLIGHT')
    def propertyValue = findProperty('skipIntegrationRuntimePreflight')
    return 'true'.equalsIgnoreCase(String.valueOf(envValue)) ||
        'true'.equalsIgnoreCase(String.valueOf(propertyValue))
}

def canConnectToPort = { String host, int port, int timeoutMs ->
    Socket socket = new Socket()
    try {
        socket.connect(new InetSocketAddress(host, port), timeoutMs)
        return true
    } catch (Exception ignored) {
        return false
    } finally {
        try {
            socket.close()
        } catch (Exception ignored) {
        }
    }
}

tasks.register('integrationRuntimePreflight') {
    description = 'Fails fast when the PostgreSQL/Redis runtime required by integration tests is not available.'
    group = 'verification'

    doLast {
        if (integrationRuntimePreflightDisabled()) {
            logger.lifecycle('integration runtime preflight skipped via SKIP_INTEGRATION_RUNTIME_PREFLIGHT or -PskipIntegrationRuntimePreflight=true')
            return
        }

        def dbHost = '127.0.0.1'
        def dbPort = 5433
        def redisHost = '127.0.0.1'
        def redisPort = 6379
        def timeoutMs = 1000
        def missingTargets = []

        if (!canConnectToPort(dbHost, dbPort, timeoutMs)) {
            missingTargets << "PostgreSQL ${dbHost}:${dbPort}"
        }
        if (!canConnectToPort(redisHost, redisPort, timeoutMs)) {
            missingTargets << "Redis ${redisHost}:${redisPort}"
        }

        if (!missingTargets.isEmpty()) {
            throw new GradleException(
                """Integration runtime preflight failed.
Missing: ${missingTargets.join(', ')}

integrationTest uses backend/src/test/resources/application-integration.yml and expects:
- PostgreSQL at ${dbHost}:${dbPort}
- Redis at ${redisHost}:${redisPort}

Start the local runtime first, for example:
- repo root: docker compose up -d db redis

If you are running inside WSL and use Docker Desktop, enable WSL integration first.
If you intentionally want to bypass this check, use:
- SKIP_INTEGRATION_RUNTIME_PREFLIGHT=true ./gradlew integrationTest
- ./gradlew integrationTest -PskipIntegrationRuntimePreflight=true
""".stripIndent())
        }
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests that require PostgreSQL and Redis.'
    group = 'verification'

    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
    shouldRunAfter test
    dependsOn tasks.named('integrationRuntimePreflight')
}
