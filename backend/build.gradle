plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.4'
}

import java.net.InetSocketAddress
import java.net.Socket

group = 'com.example'
version = '0.0.1-SNAPSHOT'
ext['tomcat.version'] = '10.1.55'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

def loadEnvFile = { File envFile ->
    def values = [:]
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def key = trimmed.substring(0, idx).trim()
                    def value = trimmed.substring(idx + 1).trim()
                    values[key] = value
                }
            }
        }
    }
    values
}

def envFileValues = loadEnvFile(file("../.env"))
def runtimeEnv = { String key ->
    System.getenv(key) ?: envFileValues[key]
}
def sanitizedJdbcUrl = { String value, String fallback ->
    if (!value || value.startsWith('jdbc:mysql://') || value.startsWith('jdbc:postgresql://db:')) {
        return fallback
    }
    value
}
def sanitizedUsername = { String value, String fallback ->
    if (!value || value == 'root') {
        return fallback
    }
    value
}
def sanitizedRedisHost = { String value ->
    if (!value || value == 'redis') {
        return 'localhost'
    }
    value
}
def sanitizedRedisPort = { String value ->
    value ?: '6379'
}

dependencies {
    constraints {
        implementation('org.asynchttpclient:async-http-client:2.15.0') {
            because 'web-push transitively pulls a vulnerable async-http-client on older versions'
        }
        implementation('org.bitbucket.b_c:jose4j:0.9.6') {
            because 'web-push transitively pulls a vulnerable jose4j on older versions'
        }
    }

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'  // WebClient

    // DB
    runtimeOnly 'org.postgresql:postgresql:42.7.11'

    // Redis (Refresh Token 저장)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // XML 파싱 (복지로 API) — XXE 비활성화 필수
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // HTML 정제 (XSS 방지)
    implementation 'org.jsoup:jsoup:1.17.2'

    // Web Push
    implementation 'nl.martijndwars:web-push:5.1.2'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.84'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

