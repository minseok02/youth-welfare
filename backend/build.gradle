plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'  // WebClient

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // Redis (Refresh Token 저장)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // XML 파싱 (복지로 API) — XXE 비활성화 필수
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // HTML 정제 (XSS 방지)
    implementation 'org.jsoup:jsoup:1.17.2'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Swagger (springdoc-openapi)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

bootRun {
    def envFile = file("../.env")
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            def trimmed = line.trim()
            if (trimmed && !trimmed.startsWith('#')) {
                def idx = trimmed.indexOf('=')
                if (idx > 0) {
                    def key = trimmed.substring(0, idx).trim()
                    def value = trimmed.substring(idx + 1).trim()
                    environment(key, value)
                }
            }
        }
    }
    // Docker 컨테이너 포트 로컬 매핑 (db:5432 → localhost:5433, redis → localhost)
    environment 'DB_URL', 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable'
    environment 'APP_PII_DB_URL', 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii'
    environment 'NOTIFICATION_PII_DB_URL', 'jdbc:postgresql://localhost:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii'
    environment 'REDIS_HOST', 'localhost'
    environment 'REDIS_PORT', '6379'
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/integration/**'
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests that require PostgreSQL and Redis.'
    group = 'verification'

    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/integration/**'
    shouldRunAfter test
}
