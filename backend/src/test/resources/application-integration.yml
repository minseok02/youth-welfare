spring:
  datasource:
    url: ${INTEGRATION_DB_URL:jdbc:postgresql://127.0.0.1:5433/youth_welfare?sslmode=disable}
    username: ${INTEGRATION_DB_USERNAME:app_core_rw}
    password: ${INTEGRATION_DB_PASSWORD:welfare1234!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  mail:
    host: localhost
    port: 2525
    username: test
    password: test

jwt:
  secret: 12345678901234567890123456789012
  access-expiration: 1800000
  refresh-expiration: 604800000
  notification-expiration: 2592000000

aes:
  secret-key: 12345678901234567890123456789012

user:
  pii-sync:
    retry:
      enabled: true
      batch-size: 10
      fixed-delay-ms: 3600000
      initial-delay-ms: 3600000

openai:
  api-key: test-openai-key
  model: gpt-4o-mini
  embedding:
    model: text-embedding-3-small
    dimensions: 256
    force-local-fallback: true

chat:
  rate-limit:
    max-requests: 5
    window-seconds: 60
  retrieval:
    min-result-count: 3
    semantic-blend-limit: 2
    semantic-only-limit: 3
    max-preferred-terms-in-search-keyword: 3

youth-api:
  api-key: test-youth-api-key

bokjiro:
  api-key: test-bokjiro-api-key

app:
  base-url: http://localhost:8082
  datasource:
    admin-ro:
      url: ${INTEGRATION_ADMIN_RO_DB_URL:jdbc:postgresql://127.0.0.1:5433/youth_welfare?sslmode=disable}
      username: ${INTEGRATION_ADMIN_RO_DB_USERNAME:admin_dashboard_ro}
      password: ${INTEGRATION_ADMIN_RO_DB_PASSWORD:welfare1234!}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        minimum-idle: 0
        read-only: true
    pii-rw:
      url: ${INTEGRATION_APP_PII_DB_URL:jdbc:postgresql://127.0.0.1:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}
      username: ${INTEGRATION_APP_PII_DB_USERNAME:app_pii_rw}
      password: ${INTEGRATION_APP_PII_DB_PASSWORD:welfare1234!}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        minimum-idle: 0
    notification-pii-ro:
      url: ${INTEGRATION_NOTIFICATION_PII_DB_URL:jdbc:postgresql://127.0.0.1:5433/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}
      username: ${INTEGRATION_NOTIFICATION_PII_DB_USERNAME:notification_pii_ro}
      password: ${INTEGRATION_NOTIFICATION_PII_DB_PASSWORD:welfare1234!}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 2
        minimum-idle: 0

auth:
  refresh:
    cookie-secure: false

security:
  admin-emails: admin@youth-welfare.dev
