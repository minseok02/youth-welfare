spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}
    username: ${DB_USERNAME:app_core_rw}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${GMAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${GMAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000       # 30분 (ms)
  refresh-expiration: 604800000    # 7일 (ms)

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini
  timeout: 30000
  embedding:
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:256}
    timeout: ${OPENAI_EMBEDDING_TIMEOUT:30000}
    force-local-fallback: ${OPENAI_EMBEDDING_FORCE_LOCAL_FALLBACK:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:${GMAIL_USERNAME:}}}
    reply-to: ${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS:${MAIL_USERNAME:${GMAIL_USERNAME:}}}}
  datasource:
    admin-ro:
      url: ${ADMIN_RO_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_ADMIN_RO_USERNAME:admin_dashboard_ro}
      password: ${DB_ADMIN_RO_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_ADMIN_RO_POOL_MAX_SIZE:2}
        minimum-idle: ${DB_ADMIN_RO_POOL_MIN_IDLE:0}
        read-only: true
    recommendation-review-gate-command:
      url: ${RECOMMENDATION_REVIEW_GATE_COMMAND_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_USERNAME:recommendation_review_gate_command_rw}
      password: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_RECOMMENDATION_REVIEW_GATE_COMMAND_POOL_MIN_IDLE:0}
    recommendation-persistence-command:
      url: ${RECOMMENDATION_PERSISTENCE_COMMAND_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_USERNAME:recommendation_persistence_command_rw}
      password: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_RECOMMENDATION_PERSISTENCE_COMMAND_POOL_MIN_IDLE:0}
    chat-session-cleanup:
      url: ${CHAT_SESSION_CLEANUP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_CHAT_SESSION_CLEANUP_USERNAME:chat_session_cleanup_rw}
      password: ${DB_CHAT_SESSION_CLEANUP_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_CHAT_SESSION_CLEANUP_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_CHAT_SESSION_CLEANUP_POOL_MIN_IDLE:0}
    cluster-ai-cleanup:
      url: ${CLUSTER_AI_CLEANUP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_CLUSTER_AI_CLEANUP_USERNAME:cluster_ai_cleanup_rw}
      password: ${DB_CLUSTER_AI_CLEANUP_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_CLUSTER_AI_CLEANUP_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_CLUSTER_AI_CLEANUP_POOL_MIN_IDLE:0}
    recommendation-retention-cleanup:
      url: ${RECOMMENDATION_RETENTION_CLEANUP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_RECOMMENDATION_RETENTION_CLEANUP_USERNAME:recommendation_retention_cleanup_rw}
      password: ${DB_RECOMMENDATION_RETENTION_CLEANUP_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_RECOMMENDATION_RETENTION_CLEANUP_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_RECOMMENDATION_RETENTION_CLEANUP_POOL_MIN_IDLE:0}
    collect-execution-lock-cleanup:
      url: ${COLLECT_EXECUTION_LOCK_CLEANUP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_COLLECT_EXECUTION_LOCK_CLEANUP_USERNAME:collect_execution_lock_cleanup_rw}
      password: ${DB_COLLECT_EXECUTION_LOCK_CLEANUP_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_COLLECT_EXECUTION_LOCK_CLEANUP_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_COLLECT_EXECUTION_LOCK_CLEANUP_POOL_MIN_IDLE:0}
    web-push-subscription-cleanup:
      url: ${WEB_PUSH_SUBSCRIPTION_CLEANUP_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}}
      username: ${DB_WEB_PUSH_SUBSCRIPTION_CLEANUP_USERNAME:web_push_subscription_cleanup_rw}
      password: ${DB_WEB_PUSH_SUBSCRIPTION_CLEANUP_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_WEB_PUSH_SUBSCRIPTION_CLEANUP_POOL_MAX_SIZE:1}
        minimum-idle: ${DB_WEB_PUSH_SUBSCRIPTION_CLEANUP_POOL_MIN_IDLE:0}
    pii-rw:
      url: ${APP_PII_DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}
      username: ${DB_APP_PII_USERNAME:app_pii_rw}
      password: ${DB_APP_PII_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_APP_PII_POOL_MAX_SIZE:4}
        minimum-idle: ${DB_APP_PII_POOL_MIN_IDLE:0}
    notification-pii-ro:
      url: ${NOTIFICATION_PII_DB_URL:${APP_PII_DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}}
      username: ${DB_NOTIFICATION_PII_RO_USERNAME:notification_pii_ro}
      password: ${DB_NOTIFICATION_PII_RO_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: ${DB_NOTIFICATION_PII_RO_POOL_MAX_SIZE:2}
        minimum-idle: ${DB_NOTIFICATION_PII_RO_POOL_MIN_IDLE:0}

auth:
  refresh:
    cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
  password-reset:
    expiration-minutes: ${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:30}
    request-cooldown-seconds: ${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}

chat:
  rate-limit:
    max-requests: ${CHAT_RATE_LIMIT_MAX_REQUESTS:5}
    window-seconds: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}
  retrieval:
    min-result-count: ${CHAT_RETRIEVAL_MIN_RESULT_COUNT:3}
    semantic-blend-limit: ${CHAT_RETRIEVAL_SEMANTIC_BLEND_LIMIT:2}
    semantic-only-limit: ${CHAT_RETRIEVAL_SEMANTIC_ONLY_LIMIT:3}
    max-preferred-terms-in-search-keyword: ${CHAT_RETRIEVAL_MAX_PREFERRED_TERMS_IN_SEARCH_KEYWORD:3}

policy:
  rate-limit:
    search:
      max-requests: ${POLICY_SEARCH_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: ${POLICY_SEARCH_RATE_LIMIT_WINDOW_SECONDS:60}
    suggestion:
      max-requests: ${POLICY_SUGGESTION_RATE_LIMIT_MAX_REQUESTS:180}
      window-seconds: ${POLICY_SUGGESTION_RATE_LIMIT_WINDOW_SECONDS:60}
    trending:
      max-requests: ${POLICY_TRENDING_RATE_LIMIT_MAX_REQUESTS:30}
      window-seconds: ${POLICY_TRENDING_RATE_LIMIT_WINDOW_SECONDS:60}
    detail:
      max-requests-per-service: ${POLICY_DETAIL_RATE_LIMIT_MAX_REQUESTS_PER_SERVICE:20}
      window-seconds: ${POLICY_DETAIL_RATE_LIMIT_WINDOW_SECONDS:60}
  retrieval:
    gate:
      min-top1-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_TOP1_HIT_RATE:0.9}
      min-top3-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_TOP3_HIT_RATE:0.9}
      min-branch-suggestion-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_BRANCH_SUGGESTION_HIT_RATE:1.0}
      max-empty-result-count: ${POLICY_RETRIEVAL_GATE_MAX_EMPTY_RESULT_COUNT:0}

aes:
  secret-key: ${AES_SECRET_KEY}    # 32바이트 (AES-256)

user:
  pii-sync:
    retry:
      enabled: ${USER_PII_SYNC_RETRY_ENABLED:true}
      batch-size: ${USER_PII_SYNC_RETRY_BATCH_SIZE:100}
      fixed-delay-ms: ${USER_PII_SYNC_RETRY_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${USER_PII_SYNC_RETRY_INITIAL_DELAY_MS:60000}

youth-api:
  api-key: ${YOUTH_API_KEY:${PUBLIC_DATA_PORTAL_API_KEY:}}
  base-url: https://www.youthcenter.go.kr/go/ythAct/getPlcyList.do

bokjiro:
  api-key: ${PUBLIC_DATA_PORTAL_API_KEY:}
  central-base-url: https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do
  local-base-url: https://www.bokjiro.go.kr/ssis-tbu/twatla/lwlfareInfo/moveTWAT52005M.do

gov24:
  api-key: ${PUBLIC_DATA_PORTAL_API_KEY:}
  base-url: https://api.odcloud.kr/api
  max-items-per-run: ${GOV24_COLLECT_MAX_ITEMS_PER_RUN:20000}

collect:
  list:
    request-interval-ms: 300
    max-items-per-run: ${COLLECT_LIST_MAX_ITEMS_PER_RUN:10000}
    max-consecutive-rate-limit-hits: 3
    rate-limit-cooldown-ms: 10000
    local-rate-limit-open-circuit-ms: 1800000
    retry:
      max-attempts: 3
      base-backoff-ms: 1000
  detail:
    gov24:
      max-calls-per-run: ${GOV24_DETAIL_MAX_CALLS_PER_RUN:50}
    central:
      max-calls-per-run: ${COLLECT_DETAIL_CENTRAL_MAX_CALLS_PER_RUN:10000}  # 복지로 중앙 detail 1회 실행 안전 상한
    local:
      max-calls-per-run: ${COLLECT_DETAIL_LOCAL_MAX_CALLS_PER_RUN:10000}  # 복지로 지자체 detail 1회 실행 안전 상한
    request-interval-ms: ${COLLECT_DETAIL_REQUEST_INTERVAL_MS:300}
    max-consecutive-rate-limit-hits: ${COLLECT_DETAIL_MAX_CONSECUTIVE_RATE_LIMIT_HITS:2}
    retry:
      max-attempts: 3
      base-backoff-ms: 1500
  support-conditions:
    gov24:
      max-calls-per-run: ${GOV24_SUPPORT_CONDITIONS_MAX_CALLS_PER_RUN:50}

recommend:
  refresh-cache-ttl-minutes: ${RECOMMEND_REFRESH_CACHE_TTL_MINUTES:15}

notification:
  web-push:
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

security:
  admin-emails: ${SECURITY_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173}
