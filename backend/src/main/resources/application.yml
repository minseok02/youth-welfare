spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/youth_welfare?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:app_core_rw}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000       # 30분 (ms)
  refresh-expiration: 604800000    # 7일 (ms)

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  timeout: 30000

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  datasource:
    pii-rw:
      url: ${APP_PII_DB_URL:jdbc:mysql://localhost:3306/youth_welfare_pii?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
      username: ${DB_APP_PII_USERNAME:app_pii_rw}
      password: ${DB_APP_PII_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: com.mysql.cj.jdbc.Driver
    notification-pii-ro:
      url: ${NOTIFICATION_PII_DB_URL:${APP_PII_DB_URL:jdbc:mysql://localhost:3306/youth_welfare_pii?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul}}
      username: ${DB_NOTIFICATION_PII_RO_USERNAME:notification_pii_ro}
      password: ${DB_NOTIFICATION_PII_RO_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: com.mysql.cj.jdbc.Driver

auth:
  password-reset:
    expiration-minutes: ${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:30}

chat:
  rate-limit:
    max-requests: ${CHAT_RATE_LIMIT_MAX_REQUESTS:5}
    window-seconds: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}

aes:
  secret-key: ${AES_SECRET_KEY}    # 32바이트 (AES-256)

user:
  pii-sync:
    retry:
      enabled: ${USER_PII_SYNC_RETRY_ENABLED:true}
      batch-size: ${USER_PII_SYNC_RETRY_BATCH_SIZE:100}
      fixed-delay-ms: ${USER_PII_SYNC_RETRY_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${USER_PII_SYNC_RETRY_INITIAL_DELAY_MS:60000}

youth-api:
  api-key: ${YOUTH_API_KEY}
  base-url: https://www.youthcenter.go.kr/go/ythAct/getPlcyList.do

bokjiro:
  api-key: ${BOKJIRO_API_KEY}
  central-base-url: https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do
  local-base-url: https://www.bokjiro.go.kr/ssis-tbu/twatla/lwlfareInfo/moveTWAT52005M.do

collect:
  list:
    request-interval-ms: 300
    max-consecutive-rate-limit-hits: 3
    rate-limit-cooldown-ms: 10000
    local-rate-limit-open-circuit-ms: 1800000
    retry:
      max-attempts: 3
      base-backoff-ms: 1000
  detail:
    max-calls-per-run: 900  # 트래픽 제한 1,000 가정 시 여유값
    max-calls-per-api-per-run: 95  # API 기능별 일일 100 제한 기준(여유 5)
    request-interval-ms: 1000
    max-consecutive-rate-limit-hits: 1
    retry:
      max-attempts: 3
      base-backoff-ms: 1500

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

security:
  admin-emails: ${SECURITY_ADMIN_EMAILS:}
