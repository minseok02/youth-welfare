spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable}
    username: ${DB_USERNAME:app_core_rw}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${GMAIL_USERNAME:}}
    password: ${MAIL_PASSWORD:${GMAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000       # 30분 (ms)
  refresh-expiration: 604800000    # 7일 (ms)

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
  timeout: 30000
  embedding:
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:256}
    timeout: ${OPENAI_EMBEDDING_TIMEOUT:30000}
    force-local-fallback: ${OPENAI_EMBEDDING_FORCE_LOCAL_FALLBACK:false}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from-address: ${MAIL_FROM_ADDRESS:${MAIL_USERNAME:${GMAIL_USERNAME:}}}
    reply-to: ${MAIL_REPLY_TO:${MAIL_FROM_ADDRESS:${MAIL_USERNAME:${GMAIL_USERNAME:}}}}
  datasource:
    pii-rw:
      url: ${APP_PII_DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}
      username: ${DB_APP_PII_USERNAME:app_pii_rw}
      password: ${DB_APP_PII_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver
    notification-pii-ro:
      url: ${NOTIFICATION_PII_DB_URL:${APP_PII_DB_URL:jdbc:postgresql://localhost:5432/youth_welfare?sslmode=disable&currentSchema=youth_welfare_pii}}
      username: ${DB_NOTIFICATION_PII_RO_USERNAME:notification_pii_ro}
      password: ${DB_NOTIFICATION_PII_RO_PASSWORD:${DB_PASSWORD:}}
      driver-class-name: org.postgresql.Driver

auth:
  refresh:
    cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
  password-reset:
    expiration-minutes: ${AUTH_PASSWORD_RESET_EXPIRATION_MINUTES:30}
    request-cooldown-seconds: ${AUTH_PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}

chat:
  rate-limit:
    max-requests: ${CHAT_RATE_LIMIT_MAX_REQUESTS:5}
    window-seconds: ${CHAT_RATE_LIMIT_WINDOW_SECONDS:60}
  retrieval:
    min-result-count: ${CHAT_RETRIEVAL_MIN_RESULT_COUNT:3}
    semantic-blend-limit: ${CHAT_RETRIEVAL_SEMANTIC_BLEND_LIMIT:2}
    semantic-only-limit: ${CHAT_RETRIEVAL_SEMANTIC_ONLY_LIMIT:3}
    max-preferred-terms-in-search-keyword: ${CHAT_RETRIEVAL_MAX_PREFERRED_TERMS_IN_SEARCH_KEYWORD:3}

policy:
  rate-limit:
    search:
      max-requests: ${POLICY_SEARCH_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: ${POLICY_SEARCH_RATE_LIMIT_WINDOW_SECONDS:60}
    detail:
      max-requests-per-service: ${POLICY_DETAIL_RATE_LIMIT_MAX_REQUESTS_PER_SERVICE:20}
      window-seconds: ${POLICY_DETAIL_RATE_LIMIT_WINDOW_SECONDS:60}
  retrieval:
    gate:
      min-top1-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_TOP1_HIT_RATE:0.9}
      min-top3-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_TOP3_HIT_RATE:0.9}
      min-branch-suggestion-hit-rate: ${POLICY_RETRIEVAL_GATE_MIN_BRANCH_SUGGESTION_HIT_RATE:1.0}
      max-empty-result-count: ${POLICY_RETRIEVAL_GATE_MAX_EMPTY_RESULT_COUNT:0}

aes:
  secret-key: ${AES_SECRET_KEY}    # 32바이트 (AES-256)

user:
  pii-sync:
    retry:
      enabled: ${USER_PII_SYNC_RETRY_ENABLED:true}
      batch-size: ${USER_PII_SYNC_RETRY_BATCH_SIZE:100}
      fixed-delay-ms: ${USER_PII_SYNC_RETRY_FIXED_DELAY_MS:300000}
      initial-delay-ms: ${USER_PII_SYNC_RETRY_INITIAL_DELAY_MS:60000}

youth-api:
  api-key: ${YOUTH_API_KEY:${PUBLIC_DATA_PORTAL_API_KEY:}}
  base-url: https://www.youthcenter.go.kr/go/ythAct/getPlcyList.do

bokjiro:
  api-key: ${PUBLIC_DATA_PORTAL_API_KEY:}
  central-base-url: https://www.bokjiro.go.kr/ssis-tbu/twataa/wlfareInfo/moveTWAT52011M.do
  local-base-url: https://www.bokjiro.go.kr/ssis-tbu/twatla/lwlfareInfo/moveTWAT52005M.do

gov24:
  api-key: ${PUBLIC_DATA_PORTAL_API_KEY:}
  base-url: https://api.odcloud.kr/api
  max-items-per-run: ${GOV24_COLLECT_MAX_ITEMS_PER_RUN:20000}

collect:
  list:
    request-interval-ms: 300
    max-items-per-run: ${COLLECT_LIST_MAX_ITEMS_PER_RUN:10000}
    max-consecutive-rate-limit-hits: 3
    rate-limit-cooldown-ms: 10000
    local-rate-limit-open-circuit-ms: 1800000
    retry:
      max-attempts: 3
      base-backoff-ms: 1000
  detail:
    gov24:
      max-calls-per-run: ${GOV24_DETAIL_MAX_CALLS_PER_RUN:50}
    central:
      max-calls-per-run: ${COLLECT_DETAIL_CENTRAL_MAX_CALLS_PER_RUN:10000}  # 복지로 중앙 detail 1회 실행 안전 상한
    local:
      max-calls-per-run: ${COLLECT_DETAIL_LOCAL_MAX_CALLS_PER_RUN:10000}  # 복지로 지자체 detail 1회 실행 안전 상한
    request-interval-ms: ${COLLECT_DETAIL_REQUEST_INTERVAL_MS:300}
    max-consecutive-rate-limit-hits: ${COLLECT_DETAIL_MAX_CONSECUTIVE_RATE_LIMIT_HITS:2}
    retry:
      max-attempts: 3
      base-backoff-ms: 1500
  support-conditions:
    gov24:
      max-calls-per-run: ${GOV24_SUPPORT_CONDITIONS_MAX_CALLS_PER_RUN:50}

recommend:
  refresh-cache-ttl-minutes: ${RECOMMEND_REFRESH_CACHE_TTL_MINUTES:15}

notification:
  web-push:
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

security:
  admin-emails: ${SECURITY_ADMIN_EMAILS:}
  cors:
    allowed-origins: ${SECURITY_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:5173,http://localhost:5173}
