services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: youth-welfare-app
    ports:
      - "127.0.0.1:8082:8080"
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    depends_on:
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: youth-welfare-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /data:size=64m,mode=700
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
